# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app - BasaltHQ Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
          cache: "npm"

      - name: npm install, build, and test
        env:
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_THIRDWEB_CLIENT_ID }}
          NEXT_PUBLIC_CHAIN_ID: ${{ secrets.NEXT_PUBLIC_CHAIN_ID }}
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID }}
          COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
          COSMOS_DB_ID: ${{ secrets.COSMOS_DB_ID }}
          COSMOS_CONTAINER_ID: ${{ secrets.COSMOS_CONTAINER_ID }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_COLLECTION: ${{ secrets.DB_COLLECTION }}
          MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          STORAGE_PROVIDER: ${{ secrets.STORAGE_PROVIDER }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

        run: |
          # Clean any existing build artifacts to prevent stale cache
          rm -rf .next
          npm install
          npm run build --if-present
          npm run test --if-present
